<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو ديجيتال | المنيو الكامل والنهائي</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --الأسود: #0a0a0a;
            --النيون: #ccff00;
            --الأبيض: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--الأسود);
            font-family: 'Cairo', sans-serif;
            color: var(--الأبيض);
        }

        /* --- الهيدر --- */
        .main-header { padding: 40px 5%; text-align: center; border-bottom: 2px solid var(--النيون); }
        .main-header h1 { color: var(--النيون); font-size: 2.5rem; margin: 0; font-weight: 900; }

        /* --- نوار دسته‌بندی (۱۰ دسته‌بندی وسط‌چین) --- */
        .nav-container {
            position: sticky; top: 0; background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(10px); z-index: 999; height: 115px; border-bottom: 1px solid #222;
        }
        .category-nav {
            display: flex; overflow-x: auto; gap: 20px; padding: 0 5%;
            height: 100%; align-items: center; justify-content: center;
            scrollbar-width: none;
        }
        @media (max-width: 1024px) { .category-nav { justify-content: flex-start; } }
        .category-nav::-webkit-scrollbar { display: none; }
        
        .cat-item { flex: 0 0 85px; text-align: center; opacity: 0.4; cursor: pointer; transition: 0.3s; }
        .cat-item.active { opacity: 1; transform: scale(1.1); }
        .icon-circle { 
            width: 60px; height: 60px; border-radius: 18px; background: #111; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; border: 1px solid #333; margin-bottom: 5px; 
        }
        .cat-item.active .icon-circle { border-color: var(--النيون); box-shadow: 0 0 15px var(--النيون); }

        /* --- منوی شناور اصلاح شده --- */
        .fab-wrapper {
            position: fixed; bottom: 30px; left: 30px;
            z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .fab-button {
            width: 60px; height: 60px; border-radius: 50%;
            background-color: var(--الأسود); border: 2px solid var(--النيون);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative;
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.2); transition: 0.4s;
        }

        /* مرکزیت مطلق پلاس هندسی */
        .plus-icon {
            position: relative; width: 22px; height: 22px; transition: transform 0.4s;
            display: flex; align-items: center; justify-content: center;
        }
        .plus-icon::before, .plus-icon::after {
            content: ''; position: absolute; background: var(--النيون); border-radius: 2px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .plus-icon::before { width: 3px; height: 100%; }
        .plus-icon::after { width: 100%; height: 3px; }

        .fab-wrapper.active .plus-icon { transform: rotate(135deg); }

        /* آیکون‌های SVG نئونی */
        .fab-button svg { width: 28px; height: 28px; }
        .fab-button svg path { fill: var(--النيون); }

        .fab-child {
            width: 50px; height: 50px; transform: scale(0) translateY(20px);
            opacity: 0; pointer-events: none; transition: 0.3s;
        }

        .fab-wrapper.active .fab-child {
            transform: scale(1) translateY(0); opacity: 1; pointer-events: auto;
        }

        .fab-label {
            position: absolute; right: 70px; background: var(--الأسود); color: var(--النيون);
            padding: 5px 12px; border-radius: 8px; font-size: 0.8rem;
            border: 1px solid var(--النيون); white-space: nowrap; opacity: 0; transition: 0.3s;
            pointer-events: none;
        }

        @media (min-width: 1025px) { .fab-button:hover .fab-label { opacity: 1; right: 75px; } }

        /* --- کارت‌های غذا --- */
        .main-container { padding: 40px 0; }
        .category-section { margin-bottom: 80px; padding: 0 5%; }
        .section-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 30px; border-right: 8px solid var(--النيون); padding-right: 15px; }
        .food-card { background: #111; border-radius: 35px; overflow: hidden; border: 1px solid #222; position: relative; }
        .image-box { height: 280px; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .price-circle { position: absolute; top: 20px; left: 20px; background: var(--النيون); color: #000; width: 65px; height: 65px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; border: 2px solid var(--الأسود); }
        .food-info { padding: 25px; text-align: right; }
        
        footer { text-align: center; padding: 60px; color: #444; }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>فان الخور الرماد</h1>
    </header>

    <div class="nav-container">
        <div class="category-nav" id="catNav">
            <div class="cat-item active" onclick="scrollToSec('sec-0', this)"><div class="icon-circle">🍔</div><span>برجر</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-1', this)"><div class="icon-circle">🍕</div><span>بيتزا</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-2', this)"><div class="icon-circle">🍝</div><span>باستا</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-3', this)"><div class="icon-circle">🥩</div><span>لحوم</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-4', this)"><div class="icon-circle">🥗</div><span>سلطات</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-5', this)"><div class="icon-circle">🍣</div><span>سوشي</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-6', this)"><div class="icon-circle">🍟</div><span>مقبلات</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-7', this)"><div class="icon-circle">🍰</div><span>حلى</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-8', this)"><div class="icon-circle">☕</div><span>قهوة</span></div>
            <div class="cat-item" onclick="scrollToSec('sec-9', this)"><div class="icon-circle">🍹</div><span>عصائر</span></div>
        </div>
    </div>

    <div class="fab-wrapper" id="fabMenu">
        <a href="#" class="fab-button fab-child">
            <span class="fab-label">تقييمنا</span>
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </a>
        <a href="#" class="fab-button fab-child">
            <span class="fab-label">موقعنا</span>
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </a>
        <a href="https://wa.me/966560698442" class="fab-button fab-child">
            <span class="fab-label">اطلب الآن</span>
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.414 0 .004 5.408.001 12.045a11.811 11.811 0 001.592 5.996L0 24l6.135-1.61a11.745 11.745 0 005.912 1.586h.005c6.637 0 12.048-5.409 12.05-12.047a11.82 11.82 0 00-3.689-8.504"/></svg>
        </a>
        <div class="fab-button fab-main" onclick="toggleFab()">
            <div class="plus-icon"></div>
        </div>
    </div>

    <main class="main-container" id="main-content"></main>

    <footer>
        <p>تم التصميم بواسطة <span style="color: var(--النيون);">منيو ديجيتال</span> © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        function toggleFab() { document.getElementById('fabMenu').classList.toggle('active'); }

        const categories = [
            { name: "ركن البرجر", keyword: "burger" }, { name: "بيتزا إيطالية", keyword: "pizza" },
            { name: "باستا طازجة", keyword: "pasta" }, { name: "مشاوي ملكية", keyword: "steak" },
            { name: "سلطات صحية", keyword: "salad" }, { name: "سوشي ياباني", keyword: "sushi" },
            { name: "مقبلات رويال", keyword: "fries" }, { name: "حلويات شرقية", keyword: "dessert" },
            { name: "قهوة مختصة", keyword: "coffee" }, { name: "عصائر طبيعية", keyword: "juice" }
        ];

        const content = document.getElementById('main-content');
        categories.forEach((cat, idx) => {
            let slides = '';
            for(let i=1; i<=6; i++) {
                slides += `<div class="swiper-slide"><div class="food-card"><div class="price-circle">45<small>SAR</small></div><div class="image-box"><img src="images/royal-crystal/${cat.keyword}-${i}.jpg" loading="lazy"></div><div class="food-info"><h4>${cat.name} ${i}</h4><p>طعم لا يقاوم بجودة ملكية.</p></div></div></div>`;
            }
            content.innerHTML += `<section class="category-section" id="sec-${idx}"><h2 class="section-title">${cat.name}</h2><div class="swiper foodSwiper"><div class="swiper-wrapper">${slides}</div></div></section>`;
        });

        new Swiper(".foodSwiper", { slidesPerView: 1.2, spaceBetween: 25, grabCursor: true, simulateTouch: true, touchRatio: 1.2, longSwipesMs: 120, resistanceRatio: 0.85, speed: 300, lazyPreloadPrevNext: 2, breakpoints: { 1024: { slidesPerView: 3.5 } } });

        function scrollToSec(id, element) {
            const el = document.getElementById(id);
            window.scrollTo({top: el.offsetTop - 130, behavior: 'smooth'});
            document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
