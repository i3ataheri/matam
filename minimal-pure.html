<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المذاق الفاخر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --اللون-الأساسي: #D4AF37; 
            --اللون-الثانوي: #1b4d3e; 
            --اللون-الخلفية: #fdfdfd;
            --الخط-العريض: 'Cairo', sans-serif;
            --الخط-الناعم: 'Tajawal', sans-serif;
        }

        body { 
            font-family: var(--الخط-الناعم); 
            background: var(--اللون-الخلفية); 
            margin: 0; 
            overflow-x: hidden; 
            direction: rtl;
        }

        .promo-bar {
            background: var(--اللون-الثانوي);
            color: white;
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 2px solid var(--اللون-الأساسي);
        }

        .promo-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
            font-family: var(--الخط-العريض);
            font-size: 0.9rem;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100%, 0); }
        }

        .hero {
            height: 30vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/minimal-pure/ph-1514362545857-3bc16c4c7d1b.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .hero h1 { font-family: var(--الخط-العريض); font-size: 2.8rem; margin: 0; }

        .categories-nav {
            display: flex;
            justify-content: safe center; 
            overflow-x: auto;
            white-space: nowrap;
            gap: 12px;
            padding: 15px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            -webkit-overflow-scrolling: touch;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .category-btn {
            font-family: var(--الخط-العريض);
            padding: 10px 22px;
            border-radius: 50px;
            border: 2px solid #eee;
            background: white;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .category-btn.active { background: var(--اللون-الأساسي); color: white; border-color: var(--اللون-الأساسي); transform: scale(1.05); }

        .menu-grid {
            max-width: 1200px;
            margin: auto;
            padding: 25px 25px 100px;
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .menu-grid.active { display: grid; }

        .food-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
            transition: 0.3s;
            width: 100%;
        }
        .food-card:hover { transform: translateY(-10px); }

        .food-img { width: 100%; height: 200px; object-fit: cover; }
        .food-body { padding: 20px; text-align: right; }
        .food-title { font-family: var(--الخط-العريض); font-size: 1.2rem; color: var(--اللون-الثانوي); margin: 0; }
        .food-desc { color: #777; font-size: 0.85rem; margin: 10px 0; line-height: 1.5; height: 45px; overflow: hidden; }
        .price { font-family: var(--الخط-العريض); color: var(--اللون-الأساسي); font-weight: 900; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="promo-bar">
        <div class="promo-text">
            🔥 عرض الغداء: اطلب أي وجبة واحصل على مشروب مجاناً | 🚚 التوصيل متاح لكل أحياء الرياض | 🌟 جرب جديدنا: برجر الحاشي الملكي
        </div>
    </div>

    <section class="hero">
        <h1>مذاق الأصالة</h1>
    </section>

    <nav class="categories-nav">
        <button class="category-btn active" onclick="show('pizza')">🍕 البيتزا</button>
        <button class="category-btn" onclick="show('burger')">🍔 البرجر</button>
        <button class="category-btn" onclick="show('drinks')">🥤 المشروبات</button>
        <button class="category-btn" onclick="show('pasta')">🍝 الباستا</button>
        <button class="category-btn" onclick="show('appetizers')">🍟 المقبلات</button>
        <button class="category-btn" onclick="show('salads')">🥗 السلطات</button>
        <button class="category-btn" onclick="show('desserts')">🍰 الحلويات</button>
        <button class="category-btn" onclick="show('breakfast')">🍳 الفطور</button>
        <button class="category-btn" onclick="show('steaks')">🥩 الستيك</button>
        <button class="category-btn" onclick="show('seafood')">🐟 البحريات</button>
    </nav>

    <div id="pizza" class="menu-grid active"></div>
    <div id="burger" class="menu-grid"></div>
    <div id="drinks" class="menu-grid"></div>
    <div id="pasta" class="menu-grid"></div>
    <div id="appetizers" class="menu-grid"></div>
    <div id="salads" class="menu-grid"></div>
    <div id="desserts" class="menu-grid"></div>
    <div id="breakfast" class="menu-grid"></div>
    <div id="steaks" class="menu-grid"></div>
    <div id="seafood" class="menu-grid"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const data = {
            pizza: [
                {t:"مارجريتا الملكية", d:"صلصة طماطم إيطالية، موزاريلا فاخرة، ريحان طازج", p:"٣٩", img:"images/minimal-pure/ph-1702716059239-385baacdabdc.jpg"},
                {t:"بيبروني هالو", d:"شرائح بيبيروني بقري مقرمشة مع جبن مضاعف", p:"٤٥", img:"images/minimal-pure/ph-1628840042765-356cda07504e.jpg"},
                {t:"بستان الخضار", d:"فلفل ملون، فطر طازج، زيتون أسود، ذرة", p:"٤٢", img:"images/minimal-pure/ph-1565299624946-b28f40a0ae38.jpg"},
                {t:"دجاج رانش المميز", d:"قطع دجاج مشوية، صوص رانش، بصل أخضر", p:"٤٩", img:"images/minimal-pure/ph-1513104890138-7c749659a591.jpg"},
                {t:"بيتزا فور تشيز", d:"مزيج من أربع أنواع أجبان عالمية فاخرة", p:"٥٥", img:"images/minimal-pure/ph-1566843971939-1fe9e277a0c0.jpg"}
            ],
            burger: [
                {t:"كلاسيك برجر", d:"لحم أنجوس مشوي، خس، طماطم، صوص أصلي", p:"٣٥", img:"images/minimal-pure/ph-1568901346375-23c9450c58cd.jpg"},
                {t:"ترافل تشيز برجر", d:"جبنة سويسرية، صوص الترافل، فطر مشوي", p:"٤٨", img:"images/minimal-pure/ph-1594212699903-ec8a3eca50f5.jpg"},
                {t:"كرسبي تشيكن", d:"صدر دجاج مقرمش، سلطة ملفوف، صوص حار", p:"٣٨", img:"images/minimal-pure/ph-1562967914-608f82629710.jpg"},
                {t:"برجر الحاشي", d:"لحم حاشي طازج يومياً، خبز بريوش، نكهة نجدية", p:"٥٢", img:"images/minimal-pure/ph-1550547660-d9450f859349.jpg"},
                {t:"برجر سموكي BBQ", d:"لحم مشوي، حلقات بصل، صوص باربيكيو مدخن", p:"٤٦", img:"images/minimal-pure/ph-1553979459-d2229ba7433b.jpg"}
            ],
            drinks: [
                {t:"موهيتو ليمون", d:"نعناع، ليمون، سودا منعشة بروح الصيف", p:"١٨", img:"images/minimal-pure/ph-1513558161293-cdaf765ed2fd.jpg"},
                {t:"عصير أصفهاني", d:"مانجو طازج مع طبقة من الآيس كريم", p:"٢٥", img:"images/minimal-pure/ph-1613478223719-2ab802602423.jpg"},
                {t:"قهوة سعودية", d:"دلة قهوة عربية بالهيل والزعفران الفاخر", p:"٢٥", img:"images/minimal-pure/prem-1670684184188-bd6ce82fd366.jpg"}
            ],
            pasta: [
                {t:"فيتوتشيني ألفريدو", d:"باستا إيطالية، دجاج، فطر، كريمة غنية", p:"٤٢", img:"images/minimal-pure/ph-1693609929783-f6a1cfd35b41.jpg"},
                {t:"لازانيا بقر", d:"طبقات باستا، بولونيز، أجبان إيطالية", p:"٤٩", img:"images/minimal-pure/ph-1619895092538-128341789043.jpg"}
            ],
            appetizers: [
                {t:"ديناميت روبيان", d:"روبيان مقلي مقرمش، صوص حار وحلو", p:"٤٥", img:"images/minimal-pure/ph-1599487488170-d11ec9c172f0.jpg"},
                {t:"أصابع موزاريلا", d:"٦ قطع ذهبية مع صوص مارينارا", p:"٢٨", img:"images/minimal-pure/ph-1734774924912-dcbb467f8599.jpg"}
            ],
            salads: [
                {t:"سلطة سيزر", d:"خس روماني، دجاج مشوي، كروتون", p:"٣٤", img:"images/minimal-pure/ph-1550304943-4f24f54ddde9.jpg"},
                {t:"فتوش نضير", d:"خضار طازجة، خبز محمص، دبس رمان", p:"٢٦", img:"images/minimal-pure/ph-1540420773420-3366772f4999.jpg"}
            ],
            desserts: [
                {t:"كريب نوتيلا", d:"كريب فرنسي بالفراولة والموز ونوتيلا", p:"٢٨", img:"images/minimal-pure/ph-1519676867240-f03562e64548.jpg"},
                {t:"وافل بلجيكي", d:"وافل ساخن مع آيس كريم فانيليا", p:"٣٢", img:"images/minimal-pure/ph-1562376552-0d160a2f238d.jpg"}
            ],
            breakfast: [
                {t:"شكشوكة عدنية", d:"بيض بطماطم وتوابل عربية طازجة", p:"٢٤", img:"images/minimal-pure/ph-1590412200988-a436970781fa.jpg"},
                {t:"بان كيك كلاسيك", d:"طبقات بان كيك مع عسل وزبدة", p:"٢٩", img:"images/minimal-pure/ph-1710533820700-dd6f6623cc97.jpg"}
            ],
            steaks: [
                {t:"ريب آي ستيك", d:"لحم مشوي فاخر بصوص الفلفل الأسود", p:"١٢٠", img:"images/minimal-pure/ph-1600891964599-f61ba0e24092.jpg"},
                {t:"ستيك دجاج", d:"صدور دجاج مشوية متبلة بالروزماري", p:"٦٥", img:"images/minimal-pure/ph-1604908176997-125f25cc6f3d.jpg"}
            ],
            seafood: [
                {t:"روبيان جامبو", d:"روبيان مشوي بالثوم والزبدة والليمون", p:"٧٥", img:"images/minimal-pure/ph-1762631934591-8a9bf09e5dfe.jpg"},
                {t:"رز صيادية ملكي", d:"رز صيادية مع قطعة سمك كنعد مشوي", p:"٦٠", img:"images/minimal-pure/ph-1626238328324-d55282264212.jpg"}
            ]
        };

        function render() {
            for (let cat in data) {
                const container = document.getElementById(cat);
                if(container) {
                    data[cat].forEach(f => {
                        container.innerHTML += `
                            <div class="food-card" data-aos="fade-up">
                                <img src="${f.img}" class="food-img" loading="lazy">
                                <div class="food-body">
                                    <h3 class="food-title">${f.t}</h3>
                                    <p class="food-desc">${f.d}</p>
                                    <span class="price">${f.p} ريال</span>
                                </div>
                            </div>
                        `;
                    });
                }
            }
        }

        function show(id) {
            document.querySelectorAll('.menu-grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            
            const selectedGrid = document.getElementById(id);
            if(selectedGrid) selectedGrid.classList.add('active');
            
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
                event.currentTarget.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
            AOS.refresh();
        }

        render();
        AOS.init({ duration: 800, once: true });
    </script>
</body>
</html>
