<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو ديجيتال - عرض القائمة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --أحمر-داكن: #8B0000;
            --أصفر-ذهبي: #FFD700;
            --أسود-مطفي: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--أسود-مطفي);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        .menu-wrapper {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            position: relative;
            background: #000;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
        }

        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        #bgImg {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(0.4);
        }

        /* سایدبار عمودی */
        .sidebar-main {
            width: 85px;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            padding: 100px 0;
            gap: 25px;
            z-index: 10;
            border-left: 1px solid rgba(255,255,255,0.1);
            overflow-y: scroll;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .sidebar-main::-webkit-scrollbar { display: none; }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; flex-shrink: 0;
        }
        .icon-box {
            width: 52px; height: 52px; border-radius: 18px; background: #1a1a1a;
            display: flex; justify-content: center; align-items: center; font-size: 24px; border: 1px solid #333;
        }
        .nav-item span { font-size: 13px; margin-top: 6px; color: #999; font-weight: bold; }
        .nav-item.active .icon-box { background: var(--أحمر-داكن); border-color: var(--أصفر-ذهبي); transform: scale(1.1); box-shadow: 0 0 15px var(--أحمر-داكن); }
        .nav-item.active span { color: var(--أصفر-ذهبي); }

        /* منوی افقی پایین */
        .sub-menu-container {
            position: absolute;
            bottom: 45px;
            right: 90px;
            left: 5px;
            z-index: 20;
        }

        .carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 15px 40px;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .sub-card {
            flex: 0 0 130px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.4s;
        }
        .sub-card.active {
            background: var(--أحمر-داكن);
            border-color: var(--أصفر-ذهبي);
            transform: translateY(-8px);
        }
        .sub-card h4 { font-size: 14px; margin-bottom: 4px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub-card .p-tag { font-size: 12px; color: var(--أصفر-ذهبي); font-weight: bold; }

        .info-panel {
            position: absolute;
            top: 70px;
            right: 105px;
            left: 30px;
            z-index: 5;
            pointer-events: none;
        }
        #title { font-size: 34px; font-weight: 900; color: #fff; line-height: 1.1; text-shadow: 2px 2px 20px rgba(0,0,0,0.8); }
        #desc { font-size: 15px; color: #ccc; margin-top: 10px; line-height: 1.4; }

    </style>
</head>
<body>

<div class="menu-wrapper">
    <div class="bg-container">

    </div>

    <div class="sidebar-main" id="mainSidebar">

        <div class="nav-item" onclick="loadSub('coffee', this)"><div class="icon-box">☕</div><span>قهوة</span></div>
    </div>

    <div class="info-panel">
        <h2 id="title">قائمة الطعام</h2>
        <p id="desc">تصفح منوعاتنا الفاخرة</p>
    </div>

    <div class="sub-menu-container">
        <div class="carousel" id="subCarousel"></div>
    </div>
</div>

            {n: 'قهوة عربية', p: '30 SAR', d: 'دلة قهوة عربية بالهيل والزعفران', img: 'images/tv-display/ph-1590059032621-6f37ca7af30a.jpg'}
        ]

    function loadSub(cat, el) {
        const sidebar = document.getElementById('mainSidebar');
        sidebar.scrollTo({ top: el.offsetTop - sidebar.offsetHeight/2 + el.offsetHeight/2, behavior: 'smooth' });

        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        const carousel = document.getElementById('subCarousel');
        carousel.innerHTML = '';
        const items = data[cat] || data['burger'];

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'sub-card';
            card.innerHTML = `<h4>${item.n}</h4><div class="p-tag">${item.p}</div>`;
            card.onclick = () => {
                updateDisplay(item);
                carousel.scrollTo({ left: card.offsetLeft - carousel.offsetWidth/2 + card.offsetWidth/2, behavior: 'smooth' });
                document.querySelectorAll('.sub-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            };
            carousel.appendChild(card);
            if(index === 0) card.click();
        });
    }

    function updateDisplay(item) {
        const bg = document.getElementById('bgImg');
        bg.style.opacity = '0.3';
        setTimeout(() => {
            bg.src = item.img;
            document.getElementById('title').innerText = item.n;
            document.getElementById('desc').innerText = item.d;
            bg.style.opacity = '1';
        }, 150);
    }

    window.onload = () => loadSub('burger', document.querySelector('.nav-item'));
</script>

</body>
</html>
