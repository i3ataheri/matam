<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو لومينا رويال المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --nav-bg: #1e293b;
            --clr: #facc15;
            --text-main: #f8fafc;
            --accent: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text-main); }

        header {
            height: 250px;
            background: linear-gradient(rgba(15, 23, 42, 0.7), var(--bg)), 
                        url('images/lumina-royal/ph-1504674900247-0877df9cc836.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        header h1 { font-family: 'Cairo'; font-size: 2.5rem; color: var(--clr); }

        .nav-wrapper {
            position: sticky; top: 0; z-index: 1000;
            width: 100%; display: flex; justify-content: center;
            height: 110px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            padding-top: 40px;
        }

        .navigation {
            position: relative; width: 95%; max-width: 600px; height: 70px;
            background: #1e293b; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .indicator {
            position: absolute; top: -35px; width: 70px; height: 70px;
            background: var(--clr); border-radius: 50%; border: 6px solid var(--bg);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5;
        }
        .indicator::before { content: ''; position: absolute; top: 50%; left: -22px; width: 20px; height: 20px; background: transparent; border-top-right-radius: 20px; box-shadow: 1px -10px 0 0 var(--bg); }
        .indicator::after { content: ''; position: absolute; top: 50%; right: -22px; width: 20px; height: 20px; background: transparent; border-top-left-radius: 20px; box-shadow: -1px -10px 0 0 var(--bg); }

        .nav-scroll {
            display: flex; overflow-x: auto; scrollbar-width: none;
            width: 100%; height: 110px; margin-top: -40px; padding-top: 40px; overflow-y: visible;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-scroll ul { display: flex; list-style: none; height: 70px; align-items: center; padding: 0 10px; }
        .list { position: relative; min-width: 70px; height: 70px; z-index: 10; }
        .list a { display: flex; justify-content: center; align-items: center; flex-direction: column; width: 100%; height: 100%; text-decoration: none; }
        .icon { font-size: 1.5rem; transition: 0.5s; color: #fff; line-height: 70px; }
        .list.active .icon { transform: translateY(-35px); color: #000; }
        .text { position: absolute; color: var(--clr); font-size: 0.75rem; transition: 0.5s; opacity: 0; transform: translateY(20px); font-weight: bold; }
        .list.active .text { opacity: 1; transform: translateY(15px); }

        section { scroll-margin-top: 120px; }
        .content { padding: 20px; width: 100%; max-width: 1100px; margin: 20px auto; }
        .section-title { font-family: 'Cairo'; color: var(--clr); margin: 30px 0 20px; border-right: 5px solid var(--clr); padding-right: 15px; font-size: 1.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--nav-bg); border-radius: 25px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 20px; text-align: center; }
        .card h3 { color: var(--clr); margin-bottom: 8px; }
        .price { color: var(--accent); font-weight: bold; }

        footer {
            background: #020617;
            padding: 50px 30px;
            margin-top: 50px;
            border-top: 2px solid var(--nav-bg);
        }
        .footer-content {
            max-width: 1100px;
            margin: 0 auto;
            text-align: right; 
        }
        .footer-logo { font-family: 'Cairo'; color: var(--clr); font-size: 1.8rem; margin-bottom: 15px; }
        .footer-item { margin-bottom: 12px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
        .footer-item i { color: var(--clr); width: 20px; }
        .social-icons { display: flex; gap: 20px; margin-top: 20px; }
        .social-icons a { color: var(--text-main); font-size: 1.4rem; transition: 0.3s; }
        .social-icons a:hover { color: var(--clr); }
        .copy { margin-top: 40px; font-size: 0.8rem; color: #334155; border-top: 1px solid #1e293b; padding-top: 20px; }
    </style>
</head>

        function init() {
            const menuUl = document.getElementById('menuItems');
            const container = document.getElementById('main-content');
            
            categories.forEach((cat, i) => {
                menuUl.innerHTML += `
                    <li class="list ${i === 0 ? 'active' : ''}" onclick="moveInd(this, ${i})">
                        <a href="#sec${i}"><span class="icon">${cat.i}</span><span class="text">${cat.n}</span></a>
                    </li>`;

                const foods = myFoods.filter(f => f.cat === cat.n);
                let section = `<section id="sec${i}"><h2 class="section-title">${cat.n}</h2><div class="grid">`;
                
                foods.forEach(food => {
                    section += `
                        <div class="card">
                            <img src="${cat.img}" class="card-img" alt="${food.n}" loading="lazy" decoding="async">
                            <div class="card-body">
                                <h3>${food.n}</h3>
                                <p>${food.d}</p>
                                <span class="price">SR ${food.p}</span>
                            </div>
                        </div>`;
                });
                container.innerHTML += section + `</div></section>`;
            });
            setTimeout(updateIndicator, 100);
        }

        function updateIndicator() {
            const activeItem = document.querySelector('.list.active');
            const indicator = document.getElementById('ind');
            const navBox = document.getElementById('navBox');
            if (activeItem && indicator) {
                const itemRect = activeItem.getBoundingClientRect();
                const navRect = navBox.getBoundingClientRect();
                indicator.style.left = (itemRect.left - navRect.left) + 'px';
            }
        }

        function moveInd(elem, index) {
            document.querySelectorAll('.list').forEach(item => item.classList.remove('active'));
            elem.classList.add('active');
            updateIndicator();
            const navS = document.getElementById('navScroll');
            navS.scrollTo({ left: elem.offsetLeft - (navS.offsetWidth / 2) + 35, behavior: 'smooth' });
        }

        window.onload = init;
        window.onresize = updateIndicator;
    </script>
</body>
