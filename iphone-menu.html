<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رويال منيو - الأداء السلس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ذهبي: #d4af37;
            --خلفية_عميقة: #0f0f0f;
            --أبيض_ثلجی: #f0f0f0;
        }

        body {
            margin: 0; background: var(--خلفية_عميقة);
            color: var(--أبيض_ثلجی); font-family: 'Cairo', sans-serif;
            overflow-x: hidden; touch-action: pan-y;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: rgba(15, 15, 15, 0.98); text-align: center;
            padding: 30px 0; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-family: 'Tajawal', sans-serif; margin: 0; font-size: 2rem; color: var(--ذهبي); }

        .nav-container {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: sticky; top: 88px; z-index: 99;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-wrap {
            display: flex; overflow-x: auto; padding: 12px; gap: 10px;
            scrollbar-width: none; justify-content: flex-start;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 500px) { .nav-wrap { justify-content: center; } }
        .nav-wrap::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 8px 20px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05); color: #888; font-size: 0.85rem;
            white-space: nowrap; cursor: pointer; transition: 0.2s;
            font-family: 'Tajawal', sans-serif; border: 1px solid rgba(255,255,255,0.05); 
            flex-shrink: 0;
        }
        .nav-btn.active { background: var(--ذهبي); color: #000; font-weight: 800; border-color: var(--ذهبي); }

        .container { 
            padding: 15px; max-width: 550px; margin: auto; 
            min-height: 80vh;
            will-change: transform, opacity;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .card {
            position: relative; height: 210px; border-radius: 20px;
            margin-bottom: 20px; overflow: hidden;
            background: #1a1a1a; 
            transform: translate3d(0,0,0);
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-content {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 15%, transparent 100%);
            padding: 18px; color: #fff;
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        .text-info h3 { margin: 0; font-size: 1.2rem; font-family: 'Tajawal', sans-serif; color: var(--ذهبي); }
        .text-info p { margin: 4px 0 0; font-size: 0.8rem; color: #bbb; line-height: 1.3; }

        .price-circle {
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            color: #fff; border-radius: 50%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-weight: 800; border: 1px solid rgba(255,255,255,0.1);
        }
        .price-circle span { font-size: 0.55rem; color: var(--ذهبي); }
    </style>
</head>
<body>

<div class="header"><h1>ROYAL MENU</h1></div>
<div class="nav-container"><div class="nav-wrap" id="nav"></div></div>
<div class="container" id="list"></div>

<script>
    const sections = ["المشروبات", "البحري", "المشويات", "بيتزا", "برجر", "باستا", "سلطات", "مقبلات", "حلى", "فطور"];
    const menuData = {};
    let currentIndex = 0;

    sections.forEach((cat, ci) => {
        menuData[cat] = [];
        for(let i=1; i<=10; i++) {
            menuData[cat].push({
                n: `${cat} رويال`,
                d: `نكهة مميزة محضرة بعناية من أجود المكونات.`,
                p: 20 + (i * 5),
                i: `images/iphone-menu/c${ci}-${i}.jpg`
            });
        }
    });

    const listDiv = document.getElementById('list');
    const navDiv = document.getElementById('nav');

    function render(index, direction = 'none') {
        if (index === currentIndex && direction !== 'none') return;
        
        currentIndex = index;
        const cat = sections[index];
        
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
            if(i === index) btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });

        const xOffset = direction === 'next' ? -20 : (direction === 'prev' ? 20 : 0);
        listDiv.style.opacity = "0";
        listDiv.style.transform = `translate3d(${xOffset}px, 0, 0)`;

        setTimeout(() => {
            listDiv.innerHTML = menuData[cat].map(item => `
                <div class="card">
                    <img src="${item.i}" loading="lazy">
                    <div class="card-content">
                        <div class="text-info">
                            <h3>${item.n}</h3>
                            <p>${item.d}</p>
                        </div>
                        <div class="price-circle">${item.p}<span>ريال</span></div>
                    </div>
                </div>
            `).join('');
            
            listDiv.style.opacity = "1";
            listDiv.style.transform = "translate3d(0, 0, 0)";
        }, 150);
    }

    sections.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${idx===0?'active':''}`;
        btn.innerText = cat;
        btn.onclick = () => render(idx);
        navDiv.appendChild(btn);
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    document.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 60) {
            if (diff > 0 && currentIndex < sections.length - 1) render(currentIndex + 1, 'next');
            else if (diff < 0 && currentIndex > 0) render(currentIndex - 1, 'prev');
        }
    }, {passive: true});

    render(0);
</script>
</body>
</html>
