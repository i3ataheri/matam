<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو لؤلؤة المحيط</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --أزرق_عميق: #081B33;
            --أزرق_المحيط: #005A92; 
            --فيروزي_داكن: #20B2AA;
            --رملي_ناعم: #F4F7F9;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--رملي_ناعم); 
            margin: 0; padding: 0;
            color: var(--أزرق_عميق);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .cat-box span { font-family: 'Tajawal', sans-serif; }

        .marine-header {
            background: linear-gradient(135deg, #05101E, var(--أزرق_عميق));
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
            border-bottom: 5px solid var(--فيروزي_داكن);
        }

        .category-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -40px;
            position: sticky;
            top: 10px;
            z-index: 1000;
        }

        .category-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px;
            scrollbar-width: none;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 95%;
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-box {
            flex: 0 0 80px;
            height: 80px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .cat-box i { font-size: 1.5rem; color: var(--أزرق_المحيط); margin-bottom: 5px; }
        .cat-box span { font-size: 0.75rem; font-weight: 900; color: #444; }

        .cat-box.active {
            background: var(--أزرق_عميق);
            border-color: var(--فيروزي_داكن);
            transform: scale(1.05);
        }
        .cat-box.active i, .cat-box.active span { color: var(--فيروزي_داكن); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 50px auto 100px;
            padding: 0 20px;
        }

        .square-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .square-img { width: 100%; height: 200px; object-fit: cover; background: #f0f0f0; }
        .square-body { padding: 18px; text-align: right; }
        .square-body h3 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; font-weight: 800; }
        .square-body h3 i { color: var(--فيروزي_داكن); }
        .square-body p { font-size: 0.85rem; color: #666; margin: 8px 0; height: 38px; overflow: hidden; }

        .footer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .price-tag { font-weight: 900; color: var(--أزرق_المحيط); font-size: 1.1rem; }
        .add-btn { background: var(--أزرق_عميق); color: var(--فيروزي_داكن); width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
            .category-nav { border-radius: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

        <div class="cat-box" onclick="showCat('burger', this, 'fa-burger')"><i class="fas fa-burger"></i><span>برجر</span></div>
        <div class="cat-box" onclick="showCat('pasta', this, 'fa-utensils')"><i class="fas fa-utensils"></i><span>باستا</span></div>

        <div class="cat-box" onclick="showCat('salads', this, 'fa-leaf')"><i class="fas fa-leaf"></i><span>سلطات</span></div>
        <div class="cat-box" onclick="showCat('breakfast', this, 'fa-egg')"><i class="fas fa-egg"></i><span>فطور</span></div>

    function showCat(catId, element, iconClass) {
        document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('active'));
        element.classList.add('active');

        const container = document.getElementById('menu-container');
        const items = menuData[catId].map(item => `
            <div class="square-card">
                <img src="${item.img}" class="square-img" loading="lazy" onerror="this.src='images/ocean-pearl/ph-1546069901-ba9599a7e63c.jpg'">
                <div class="square-body">
                    <h3><i class="fas ${iconClass}"></i> ${item.t}</h3>
                    <p>${item.d}</p>
                    <div class="footer-item">
                        <span class="price-tag">${item.p} ريال</span>
                        <div class="add-btn"><i class="fas fa-plus"></i></div>
                    </div>
                </div>
            </div>
        `).join('');
        
        container.innerHTML = items;
        element.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    }

    window.onload = () => showCat('seafood', document.querySelector('.cat-box'), 'fa-fish');

</html>
